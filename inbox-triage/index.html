<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inbox Triage">
<meta name="theme-color" content="#000000">
<title>Inbox Triage</title>
<style>
  :root {
    --safe-top:    env(safe-area-inset-top);
    --safe-bot:    env(safe-area-inset-bottom);
    --safe-left:   env(safe-area-inset-left);
    --safe-right:  env(safe-area-inset-right);

    --text:        rgba(255, 255, 255, 0.95);
    --text-2:      rgba(255, 255, 255, 0.65);
    --text-3:      rgba(255, 255, 255, 0.45);

    --glass:       rgba(255, 255, 255, 0.06);
    --glass-2:     rgba(255, 255, 255, 0.10);
    --glass-3:     rgba(255, 255, 255, 0.14);
    --glass-line:  rgba(255, 255, 255, 0.12);

    --green:       #34C759;
    --green-bg:    rgba(52, 199, 89, 0.18);
    --yellow:      #FF9F0A;
    --yellow-bg:   rgba(255, 159, 10, 0.18);
    --red:         #FF453A;
    --red-bg:      rgba(255, 69, 58, 0.18);
    --blue:        #0A84FF;
    --blue-bg:     rgba(10, 132, 255, 0.18);
    --pink:        #FF375F;
    --purple:      #BF5AF2;

    --r-card:      24px;
    --r-pill:      999px;
    --r-btn:       16px;
    --r-sheet:     32px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    background: transparent;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro', 'Inter', system-ui, sans-serif;
    font-weight: 400;
    line-height: 1.4;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Background ambient — blobs floue colorés (style iOS Control Center) */
  .bg-stage {
    position: fixed;
    inset: 0;
    z-index: -10;
    overflow: hidden;
    background: linear-gradient(180deg, #0c0a14 0%, #050505 100%);
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: blob 24s ease-in-out infinite;
  }
  .blob.b1 { width: 540px; height: 540px; background: #6366F1; top: -180px; left: -120px; animation-delay: 0s; }
  .blob.b2 { width: 460px; height: 460px; background: #EC4899; top: 30%;  right: -180px; animation-delay: -8s; }
  .blob.b3 { width: 600px; height: 600px; background: #06B6D4; bottom: -260px; left: 40%; animation-delay: -16s; }
  @keyframes blob {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(40px, -30px) scale(1.05); }
    66% { transform: translate(-30px, 30px) scale(0.95); }
  }

  /* Topbar glass */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(8, 8, 10, 0.55);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    padding: calc(var(--safe-top) + 14px) 16px 14px;
    border-bottom: 0.5px solid var(--glass-line);
  }
  .topbar-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .topbar h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
  }
  .topbar .count {
    font-size: 13px;
    color: var(--text-2);
    margin-top: 2px;
    font-weight: 500;
  }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--glass-2);
    border: 0.5px solid var(--glass-line);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font-size: 18px;
    transition: transform 0.15s, background 0.15s;
  }
  .icon-btn:active { transform: scale(0.92); background: var(--glass-3); }
  .icon-btn.spinning svg { animation: spin 0.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main {
    padding: 16px;
    padding-bottom: calc(var(--safe-bot) + 24px);
    max-width: 720px;
    margin: 0 auto;
  }

  /* Empty / loading states */
  .state {
    text-align: center;
    padding: 80px 16px;
    color: var(--text-2);
  }
  .state .ico { font-size: 56px; margin-bottom: 16px; opacity: 0.7; }
  .state .text { font-size: 15px; }

  /* Email card — Liquid Glass */
  .card {
    background: var(--glass);
    backdrop-filter: blur(50px) saturate(180%);
    -webkit-backdrop-filter: blur(50px) saturate(180%);
    border: 0.5px solid var(--glass-line);
    border-radius: var(--r-card);
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
    transition: opacity 0.4s, transform 0.3s;
  }
  .card.snoozing {
    opacity: 0;
    transform: translateX(80px);
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  }

  .card-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
    align-items: center;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: var(--r-pill);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: -0.2px;
    line-height: 1;
  }
  .pill.host  { background: var(--blue-bg);  color: var(--blue); }
  .pill.gmail { background: var(--red-bg);   color: var(--red); }
  .pill.reason { background: var(--glass-2); color: var(--text-2); font-weight: 500; }
  .pill.time   { background: transparent; color: var(--text-3); font-weight: 500; padding: 4px 0; margin-left: auto; }

  .card-from {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.2px;
  }
  .card-subject {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    line-height: 1.3;
    letter-spacing: -0.3px;
  }
  .card-snippet {
    font-size: 14px;
    color: var(--text-2);
    line-height: 1.4;
    margin-bottom: 14px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .card-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr) auto;
    gap: 8px;
  }

  .pill-btn {
    background: var(--glass-2);
    border: 0.5px solid var(--glass-line);
    color: var(--text);
    padding: 11px 8px;
    border-radius: var(--r-btn);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.2px;
    transition: all 0.15s;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    min-height: 44px;
    white-space: nowrap;
  }
  .pill-btn:active { transform: scale(0.96); }
  .pill-btn:disabled { opacity: 0.4; cursor: wait; }
  .pill-btn.green  { background: var(--green-bg);  color: var(--green);  border-color: rgba(52, 199, 89, 0.25); }
  .pill-btn.yellow { background: var(--yellow-bg); color: var(--yellow); border-color: rgba(255, 159, 10, 0.25); }
  .pill-btn.red    { background: var(--red-bg);    color: var(--red);    border-color: rgba(255, 69, 58, 0.25); }
  .pill-btn.snooze { width: 44px; padding: 0; color: var(--text-2); }

  .pill-btn .label-mobile { display: none; }
  @media (max-width: 420px) {
    .pill-btn .label-full { display: none; }
    .pill-btn .label-mobile { display: inline; }
  }

  /* Bottom sheet pour le draft généré */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 100;
    background: rgba(20, 20, 25, 0.65);
    backdrop-filter: blur(60px) saturate(180%);
    -webkit-backdrop-filter: blur(60px) saturate(180%);
    border-top-left-radius: var(--r-sheet);
    border-top-right-radius: var(--r-sheet);
    border-top: 0.5px solid var(--glass-line);
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    padding-bottom: var(--safe-bot);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-grabber {
    width: 36px;
    height: 5px;
    background: rgba(255,255,255,0.3);
    border-radius: 3px;
    margin: 8px auto;
  }
  .sheet-header {
    padding: 8px 20px 16px;
    border-bottom: 0.5px solid var(--glass-line);
  }
  .sheet-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .sheet-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .sheet-mode {
    padding: 5px 12px;
    border-radius: var(--r-pill);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.1px;
  }
  .sheet-meta {
    margin-top: 10px;
    color: var(--text-2);
    font-size: 13px;
    line-height: 1.5;
  }
  .sheet-meta strong { color: var(--text); font-weight: 600; }
  .sheet-body {
    padding: 16px 20px;
    overflow-y: auto;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }
  .sheet-body textarea {
    width: 100%;
    min-height: 200px;
    background: rgba(0,0,0,0.25);
    color: var(--text);
    border: 0.5px solid var(--glass-line);
    border-radius: 18px;
    padding: 16px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    outline: none;
  }
  .sheet-body textarea:focus { border-color: rgba(10, 132, 255, 0.6); background: rgba(10, 132, 255, 0.06); }

  .sheet-footer {
    padding: 12px 20px 16px;
    border-top: 0.5px solid var(--glass-line);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sheet-footer .open-gmail {
    background: var(--blue);
    color: white;
    border: none;
    padding: 14px 20px;
    border-radius: var(--r-btn);
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.3px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 50px;
    transition: transform 0.15s, opacity 0.15s;
  }
  .sheet-footer .open-gmail:active { transform: scale(0.97); opacity: 0.85; }
  .sheet-footer .hint {
    color: var(--text-3);
    font-size: 11px;
    text-align: center;
    line-height: 1.4;
  }

  /* Toast iOS-style */
  .toast {
    position: fixed;
    top: calc(var(--safe-top) + 70px);
    left: 50%;
    transform: translateX(-50%) translateY(-30px);
    background: rgba(28, 28, 30, 0.85);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    color: var(--text);
    padding: 11px 18px;
    border-radius: var(--r-pill);
    border: 0.5px solid var(--glass-line);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.2px;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    max-width: calc(100vw - 32px);
    text-align: center;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { color: var(--red); }

  /* Spinner inline */
  .spin-ico {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  /* Status bar fix mobile Safari */
  @supports(padding: max(0px)) {
    body { padding-top: 0; }
  }
</style>
</head>
<body>

<div class="bg-stage">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <h1>Inbox</h1>
      <div class="count" id="count">—</div>
    </div>
    <button class="icon-btn" id="refresh-btn" onclick="loadInbox(true)" aria-label="Refresh">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"></path>
      </svg>
    </button>
  </div>
</div>

<main id="inbox"></main>

<div class="sheet-backdrop" id="sheet-bd" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grabber"></div>
  <div class="sheet-header">
    <div class="sheet-header-row">
      <div class="sheet-title">Brouillon</div>
      <span class="sheet-mode" id="sheet-mode"></span>
    </div>
    <div class="sheet-meta">
      <strong id="sheet-to"></strong><br>
      <span id="sheet-subject" style="color: var(--text-2);"></span>
    </div>
  </div>
  <div class="sheet-body">
    <textarea id="sheet-text" placeholder="Brouillon généré…"></textarea>
  </div>
  <div class="sheet-footer">
    <a class="open-gmail" id="sheet-open" target="_blank">
      Ouvrir dans Gmail
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </a>
    <div class="hint">Le brouillon est aussi dans Gmail Drafts<br>Tu peux le peaufiner ici avant d'ouvrir.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let CURRENT = [];

async function loadInbox(force = false) {
  $("count").textContent = "Chargement…";
  $("refresh-btn").classList.add("spinning");
  if (force) $("inbox").innerHTML = `<div class="state"><div class="ico">⏳</div><div class="text">Scan IMAP + Gmail…</div></div>`;
  try {
    const r = await fetch("/api/inbox" + (force ? "?force=1" : ""));
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    CURRENT = d.emails;
    updateCount();
    render(d.emails);
  } catch (e) {
    $("count").textContent = "Erreur";
    $("inbox").innerHTML = `<div class="state"><div class="ico">⚠️</div><div class="text">${esc(e.message)}</div></div>`;
  } finally {
    $("refresh-btn").classList.remove("spinning");
  }
}

function updateCount() {
  const n = CURRENT.length;
  $("count").textContent = n === 0 ? "Inbox vide" : `${n} email${n > 1 ? 's' : ''} à traiter`;
}

function render(emails) {
  if (!emails.length) {
    $("inbox").innerHTML = `<div class="state"><div class="ico">🌿</div><div class="text">Tout traité.<br>Bonne journée.</div></div>`;
    return;
  }
  $("inbox").innerHTML = emails.map((e, i) => `
    <div class="card" id="card-${i}">
      <div class="card-meta-row">
        <span class="pill ${e.account === 'Gmail' ? 'gmail' : 'host'}">${e.account === 'Gmail' ? 'Gmail' : 'Hostinger'}</span>
        <span class="pill reason">${esc(e.reason)}</span>
        <span class="pill time">${formatDate(e.date)}</span>
      </div>
      <div class="card-from">${esc(e.from_raw)}</div>
      <div class="card-subject">${esc(e.subject)}</div>
      <div class="card-snippet">${esc(e.snippet)}</div>
      <div class="card-actions">
        <button class="pill-btn green"  onclick="genDraft(${i}, 'court')">
          <span class="label-full">Court</span><span class="label-mobile">🟢</span>
        </button>
        <button class="pill-btn yellow" onclick="genDraft(${i}, 'info')">
          <span class="label-full">Info</span><span class="label-mobile">🟡</span>
        </button>
        <button class="pill-btn red"    onclick="genDraft(${i}, 'decline')">
          <span class="label-full">Décline</span><span class="label-mobile">🔴</span>
        </button>
        <button class="pill-btn snooze" onclick="snooze(${i})" aria-label="Marquer fait">✓</button>
      </div>
    </div>
  `).join("");
}

async function genDraft(idx, mode) {
  const email = CURRENT[idx];
  const card = $(`card-${idx}`);
  card.querySelectorAll(".pill-btn").forEach(b => b.disabled = true);
  toast(`Génération… <span class="spin-ico"></span>`);
  try {
    const r = await fetch("/api/draft", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({...email, mode}),
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    $("sheet-mode").textContent = labelMode(mode);
    $("sheet-mode").style.background = colorMode(mode).bg;
    $("sheet-mode").style.color = colorMode(mode).fg;
    $("sheet-to").textContent = email.from_raw;
    $("sheet-subject").textContent = "Re: " + email.subject;
    $("sheet-text").value = d.draft_text || "";
    $("sheet-open").href = d.gmail_url || "https://mail.google.com/mail/u/0/#drafts";

    openSheet();
    toast("Brouillon prêt");
    if (window.navigator.vibrate) window.navigator.vibrate(8);
  } catch (e) {
    toast(esc(e.message), true);
  } finally {
    card.querySelectorAll(".pill-btn").forEach(b => b.disabled = false);
  }
}

async function snooze(idx) {
  const email = CURRENT[idx];
  const card = $(`card-${idx}`);
  if (window.navigator.vibrate) window.navigator.vibrate(6);
  card.classList.add("snoozing");
  try {
    await fetch("/api/snooze", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({uid: email.uid}),
    });
    setTimeout(() => {
      CURRENT = CURRENT.filter((_, i) => i !== idx);
      render(CURRENT);
      updateCount();
    }, 380);
    toast("Marqué comme traité");
  } catch (e) {
    card.classList.remove("snoozing");
    toast(esc(e.message), true);
  }
}

function openSheet() {
  $("sheet").classList.add("show");
  $("sheet-bd").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  $("sheet").classList.remove("show");
  $("sheet-bd").classList.remove("show");
  document.body.style.overflow = "";
}

function esc(s) {
  const div = document.createElement("div");
  div.textContent = s == null ? "" : String(s);
  return div.innerHTML;
}
function formatDate(d) {
  if (!d) return "";
  try {
    const dt = new Date(d);
    const ms = new Date() - dt;
    const min = Math.floor(ms / 60000);
    if (min < 1) return "à l'instant";
    if (min < 60) return `${min}min`;
    if (min < 60*24) return `${Math.floor(min/60)}h`;
    if (min < 60*24*7) return `${Math.floor(min/(60*24))}j`;
    return dt.toLocaleDateString("fr-CA", {month:"short", day:"numeric"});
  } catch { return d; }
}
function labelMode(m) { return {court: "Court", info: "Info", decline: "Décline"}[m] || m; }
function colorMode(m) {
  return {
    court:   {bg: "rgba(52, 199, 89, 0.22)",  fg: "#34C759"},
    info:    {bg: "rgba(255, 159, 10, 0.22)", fg: "#FF9F0A"},
    decline: {bg: "rgba(255, 69, 58, 0.22)",  fg: "#FF453A"},
  }[m] || {bg: "rgba(255,255,255,0.1)", fg: "#fff"};
}

let toastTimer;
function toast(html, isErr=false) {
  const t = $("toast");
  t.innerHTML = html;
  t.classList.toggle("error", isErr);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), isErr ? 4000 : 2500);
}

// Swipe-down sur le sheet pour le fermer (gesture iOS-like)
let sheetTouchY = null;
$("sheet").addEventListener("touchstart", e => {
  if (e.target.closest(".sheet-body, textarea, button, a")) return;
  sheetTouchY = e.touches[0].clientY;
}, {passive: true});
$("sheet").addEventListener("touchmove", e => {
  if (sheetTouchY === null) return;
  const dy = e.touches[0].clientY - sheetTouchY;
  if (dy > 0) $("sheet").style.transform = `translateY(${dy}px)`;
}, {passive: true});
$("sheet").addEventListener("touchend", e => {
  if (sheetTouchY === null) return;
  const dy = e.changedTouches[0].clientY - sheetTouchY;
  $("sheet").style.transform = "";
  if (dy > 100) closeSheet();
  sheetTouchY = null;
}, {passive: true});

// Pull-to-refresh très simple
let prTouch = null;
window.addEventListener("touchstart", e => {
  if (window.scrollY === 0) prTouch = e.touches[0].clientY;
}, {passive: true});
window.addEventListener("touchend", e => {
  if (prTouch === null) return;
  const dy = e.changedTouches[0].clientY - prTouch;
  if (dy > 80) loadInbox(true);
  prTouch = null;
}, {passive: true});

// Init
loadInbox();
setInterval(() => loadInbox(false), 5 * 60 * 1000);

// Esc pour fermer le sheet
window.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
</script>
